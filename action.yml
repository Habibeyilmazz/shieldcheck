name: shieldcheck
description: >-
  Passive security audit of a website you own: headers, TLS, cookies, redirects,
  SPF/DMARC and security.txt. Fails the job below a minimum grade.
branding:
  icon: shield
  color: blue

inputs:
  url:
    description: URL to scan. Scan only sites you own or are authorised to test.
    required: true
  min-grade:
    description: Fail the step if the grade is worse than this (A, B, C or D). Empty never fails on grade.
    default: ""
  format:
    description: terminal, json, sarif, html or markdown.
    default: terminal
  output:
    description: File to write the report to. Empty prints it to the job log.
    default: ""
  ignore:
    description: >-
      Finding IDs to leave out of the grade, separated by commas, spaces or new lines
      (for example "coop.missing, tls.legacy-protocol"). They are still listed in the report.
    default: ""
  probe:
    description: Set to "true" to also request /.git/HEAD and /.env.
    default: "false"
  allow-private:
    description: Set to "true" to allow loopback and private addresses, such as a server started earlier in the job.
    default: "false"
  summary:
    description: Set to "false" to not add the grade and findings table to the job summary.
    default: "true"

outputs:
  grade:
    description: The grade, A to F. Empty if the scan could not run.
    value: ${{ steps.scan.outputs.grade }}
  score:
    description: The score, 0 to 100. Empty if the scan could not run.
    value: ${{ steps.scan.outputs.score }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: stable
        cache: false
    - name: Build shieldcheck
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && go build -o "$RUNNER_TEMP/shieldcheck" .
    - name: Scan
      id: scan
      shell: bash
      # Inputs go through the environment so they are never interpolated into the script.
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_MIN_GRADE: ${{ inputs.min-grade }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_PROBE: ${{ inputs.probe }}
        INPUT_ALLOW_PRIVATE: ${{ inputs.allow-private }}
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: |
        args=(scan --format "$INPUT_FORMAT")
        if [ -n "$INPUT_MIN_GRADE" ]; then args+=(--min-grade "$INPUT_MIN_GRADE"); fi
        if [ -n "$INPUT_OUTPUT" ]; then args+=(--output "$INPUT_OUTPUT"); fi
        set -f # split the ignore list on commas and whitespace, without globbing
        for id in ${INPUT_IGNORE//,/ }; do args+=(--ignore "$id"); done
        if [ "$INPUT_PROBE" = "true" ]; then args+=(--probe); fi
        if [ "$INPUT_ALLOW_PRIVATE" = "true" ]; then args+=(--allow-private); fi
        summary="$RUNNER_TEMP/shieldcheck-summary.md"
        rm -f "$summary"
        args+=(--summary "$summary")
        status=0
        "$RUNNER_TEMP/shieldcheck" "${args[@]}" -- "$INPUT_URL" || status=$?
        # The summary's first line is "## shieldcheck: grade X (N/100)".
        if [ -f "$summary" ] && [[ "$(head -n 1 "$summary")" =~ grade\ ([A-F])\ \(([0-9]+)/100\) ]]; then
          echo "grade=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "score=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          if [ "$INPUT_SUMMARY" != "false" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
        fi
        exit "$status"
