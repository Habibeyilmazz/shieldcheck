name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod # the oldest Go the module claims to support
          cache: false # no dependencies to cache
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build for Linux, macOS and Windows
        run: |
          for os in linux darwin windows; do
            GOOS=$os GOARCH=amd64 go build -o /dev/null .
          done

  vulncheck:
    # Same Go as the release binaries, so a standard library fix that has
    # shipped but is not in our build shows up here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  other-systems:
    # The release ships macOS and Windows binaries, so the tests run there too.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: The built binary runs
        shell: bash
        run: go build -o shieldcheck.exe . && ./shieldcheck.exe version

  live-fixes:
    # Pastes the generated fixes into real nginx, Apache and Caddy and scans again.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [nginx, apache, caddy]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o shieldcheck .
      - run: .github/scripts/live-fixes.sh ${{ matrix.server }}

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Start a fixture site with no security headers
        run: |
          mkdir site && echo '<html>fixture</html>' > site/index.html
          python3 -m http.server 4110 --bind 127.0.0.1 --directory site &
          sleep 1
      - name: Scan it and write SARIF
        uses: ./
        with:
          url: http://127.0.0.1:4110
          allow-private: "true"
          format: sarif
          output: shieldcheck.sarif
      - name: SARIF report was written
        run: test "$(jq -r '.version' shieldcheck.sarif)" = "2.1.0" && test "$(jq '.runs[0].results | length' shieldcheck.sarif)" -gt 3
      - name: Scan again with a minimum grade
        id: gate
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:4110
          allow-private: "true"
          min-grade: B
      - name: The grade gate failed the step and still set the grade outputs
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          GRADE: ${{ steps.gate.outputs.grade }}
          SCORE: ${{ steps.gate.outputs.score }}
        run: test "$OUTCOME" = "failure" && test "$GRADE" = "D" && test "$SCORE" -ge 45 && test "$SCORE" -lt 60
      - name: A grade gate the fixture meets passes
        uses: ./
        with:
          url: http://127.0.0.1:4110
          allow-private: "true"
          min-grade: D
      - name: Ignoring accepted findings lifts the grade over the gate
        uses: ./
        with:
          url: http://127.0.0.1:4110
          allow-private: "true"
          min-grade: B
          ignore: |
            csp.missing
            frame.missing
